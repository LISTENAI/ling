name: Unit Tests

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Rust Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Run unit tests
        # Keep this scoped to unit-test targets; integration tests under tests/ are intentionally excluded.
        run: cargo test --workspace --lib --bins --locked
