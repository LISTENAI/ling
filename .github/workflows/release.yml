name: Release
# Human release runbook: RELEASING.md

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BIN_NAME: ling
  PACKAGE: ling
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate tag and workspace versions
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          version="${tag#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ "${tag}" != v* || ! "${version}" =~ ${semver} ]]; then
            echo "Release tag must be v-prefixed SemVer, got: ${tag}" >&2
            exit 1
          fi

          prerelease=false
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          fi

          export EXPECTED_VERSION="${version}"
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          expected = os.environ["EXPECTED_VERSION"]
          metadata = json.loads(
              subprocess.check_output(
                  [
                      "cargo",
                      "metadata",
                      "--locked",
                      "--no-deps",
                      "--format-version",
                      "1",
                  ],
                  text=True,
              )
          )
          members = set(metadata["workspace_members"])
          packages = [
              package
              for package in metadata["packages"]
              if package["id"] in members
          ]
          mismatches = [
              (package["name"], package["version"])
              for package in packages
              if package["version"] != expected
          ]
          if mismatches:
              print(
                  f"All workspace packages must use release version {expected}:",
                  file=sys.stderr,
              )
              for name, version in mismatches:
                  print(f"- {name}: {version}", file=sys.stderr)
              sys.exit(1)
          PY

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            bin_ext: ""
            rustflags: ""

          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            bin_ext: ""
            rustflags: ""

          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
            bin_ext: .exe
            rustflags: "-C target-feature=+crt-static"

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
            bin_ext: .exe
            rustflags: "-C target-feature=+crt-static"

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            bin_ext: ""
            rustflags: ""

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            bin_ext: ""
            rustflags: ""

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin_ext: ""
            rustflags: ""

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin_ext: ""
            rustflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        # Use musl-gcc only for C dependencies like ring; let rustc handle the final musl link.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo rustc --release --locked -p ${{ env.PACKAGE }} --target ${{ matrix.target }} -- -D warnings

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}"
          "${bin}" --help >/dev/null

      - name: Package asset
        id: package
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"

          package_dir="${BIN_NAME}-${tag}-${{ matrix.target }}"
          staging="dist/${package_dir}"
          mkdir -p "${staging}"

          bin="target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.bin_ext }}"
          cp "${bin}" "${staging}/"
          cp README.md "${staging}/"
          cp LICENSE* "${staging}/" 2>/dev/null || true

          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          archive = os.environ["ARCHIVE"]
          package_dir = Path(os.environ["PACKAGE_DIR"])
          dist = Path("dist")

          if archive == "zip":
              asset_path = dist / f"{package_dir.name}.zip"
              with zipfile.ZipFile(asset_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  for path in sorted(package_dir.rglob("*")):
                      zf.write(path, path.relative_to(dist))
          else:
              asset_path = dist / f"{package_dir.name}.tar.gz"
              with tarfile.open(asset_path, "w:gz") as tf:
                  tf.add(package_dir, arcname=package_dir.name)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"asset_path={asset_path.as_posix()}\n")
          PY
        env:
          ARCHIVE: ${{ matrix.archive }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PACKAGE_DIR: dist/${{ env.BIN_NAME }}-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    needs:
      - prepare
      - build

    steps:
      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run download "${GITHUB_RUN_ID}" --dir artifacts
          mkdir -p dist
          while IFS= read -r -d "" artifact; do
            mv "${artifact}" dist/
          done < <(find artifacts -mindepth 2 -maxdepth 2 -type f -print0)

          artifact_count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [[ "${artifact_count}" -ne 8 ]]; then
            echo "Expected 8 release artifacts, found ${artifact_count}" >&2
            exit 1
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            actual_prerelease="$(
              gh release view "${tag}" --json isPrerelease \
                --jq '.isPrerelease'
            )"
            if [[ "${actual_prerelease}" != "${IS_PRERELEASE}" ]]; then
              echo "Existing release prerelease state does not match ${tag}" >&2
              exit 1
            fi
            gh release upload "${tag}" dist/* --clobber
          else
            release_flags=(--verify-tag --generate-notes)
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
            gh release create "${tag}" dist/* "${release_flags[@]}"
          fi

      - name: Bump Homebrew tap
        if: needs.prepare.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap bump."
            exit 0
          fi

          gh api repos/LISTENAI/homebrew-tap/dispatches \
            -f event_type=bump \
            -f 'client_payload[project]=ling'
