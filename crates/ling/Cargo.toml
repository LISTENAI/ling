[package]
name = "ling"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
getrandom = "0.3"
libc = "0.2"
ling-core = { path = "../ling-core" }
ling-plugin-app-project = { path = "../ling-plugin-app-project" }
ling-plugin-ai = { path = "../ling-plugin-ai" }
ling-plugin-app = { path = "../ling-plugin-app" }
ling-plugin-kb = { path = "../ling-plugin-kb" }
ling-plugin-wiki = { path = "../ling-plugin-wiki" }
rpassword = "7.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
webbrowser = { version = "1.2", features = ["hardened"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
